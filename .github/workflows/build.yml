name: Build

# O deploy agora é local (npm run deploy, ver docs/DEPLOY.md).
# Este workflow só confere se o site compila a cada push e pull request.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
